add_newline = true
format = "$username$hostname$directory$git_branch$git_status$nix_shell$character"

[character]
error_symbol = "[➜](bold #e67e80)"
success_symbol = "[➜](bold #7fbbb3)"

[directory]
style = "bold #7fbbb3"
truncate_to_repo = true
truncation_length = 3

[git_branch]
style = "bold #d699b6"
symbol = " "

[git_status]
style = "bold #a7a89c"

[nix_shell]
format = "via [$symbol$state]($style) "
style = "bold #83c092"
symbol = " "
