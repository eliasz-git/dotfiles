version: "3.9"

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  netalertx:
    <<: *common
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    # netalertx does passive LAN discovery (ARP/NBNS/mDNS) — bridge networking
    # blocks it and the container exits 126. Host networking is required so it
    # sees the host's LAN (192.168.1.0/24) and Tailscale (100.64.0.0/10).
    network_mode: host
    environment:
      - PORT=20211
      - TZ=America/New_York
      - NETWORKS=192.168.1.0/24,100.64.0.0/10
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - /mnt/storage/family-apps/netalertx:/data
  beszel:
    <<: *common
    image: henrygd/beszel:latest
    container_name: beszel
    ports: ["6767:8090"]
    volumes:
      - /mnt/storage/family-apps/beszel:/beszel_data
    environment:
      - APP_URL=http://localhost:8090

  karakeep:
    <<: *common
    image: ghcr.io/karakeep-app/karakeep:latest
    container_name: karakeep
    ports: ["8081:3000"]
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      NEXTAUTH_URL: http://localhost:8081
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
    depends_on:
      - karakeep-meilisearch
      - karakeep-chrome

  karakeep-meilisearch:
    <<: *common
    image: getmeili/meilisearch:v1
    container_name: karakeep-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /mnt/storage/family-apps/karakeep-meilisearch:/meili_data

  karakeep-chrome:
    <<: *common
    # zenika/alpine-chrome on Docker Hub; the gcr.io/zenika-hub mirror now
    # requires GCP billing and refuses pulls.
    image: zenika/alpine-chrome:123
    container_name: karakeep-chrome
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --window-size=1440,900

  calibre-web:
    <<: *common
    # linuxserver.io moved from lscr.io to ghcr.io
    image: ghcr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    ports: ["8083:8083"]
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - /mnt/storage/family-apps/calibre-web:/config
      - /mnt/storage/books:/books:ro

  wger:
    <<: *common
    image: wger/server:latest
    container_name: wger
    ports: ["8000:8000"]
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_DATABASE: wger
      DJANGO_DB_USER: wger
      DJANGO_DB_PASSWORD: ${WGER_DB_PASSWORD:?WGER_DB_PASSWORD is required}
      DJANGO_DB_HOST: wger-db
      DJANGO_DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DEBUG: "False"
      DJANGO_PERFORM_MIGRATIONS: "True"
    depends_on:
      - wger-db
    volumes:
      - /mnt/storage/family-apps/wger/media:/wger/media

  wger-db:
    image: postgres:16-alpine
    container_name: wger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${WGER_DB_PASSWORD:?WGER_DB_PASSWORD is required}
    volumes:
      - /mnt/storage/family-apps/wger-db:/var/lib/postgresql/data

  vaultwarden:
    <<: *common
    image: vaultwarden/server:latest
    container_name: vaultwarden
    ports: ["8084:80"]
    volumes:
      - /mnt/storage/family-apps/vaultwarden:/data
    environment:
      - SIGNUPS_ALLOWED=true
