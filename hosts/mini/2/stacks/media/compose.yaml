# mini2 — media stack (R5 2400GE Vega 11, headless, 16GB)
# Deploy: systemctl start homelab-compose-media (NixOS manages this lifecycle)
# Requires: /mnt/storage mounted from mini1 and /var/lib/secrets/stacks/media.env
# PUID/PGID 1000 = elias. Change if your user id differs (id -u / id -g).
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # prowlarr moved to services.prowlarr in configuration.nix (native)

  # flaresolverr moved to services.flaresolverr in configuration.nix (native)

  # seerr moved to services.seerr in configuration.nix (native)

  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:100"
    ports: ["8096:8096", "8920:8920"]
    devices: ["/dev/dri:/dev/dri"]
    environment:
      - TZ=America/New_York
    volumes:
      - /var/lib/homelab-media/jellyfin/config:/config
      - /var/lib/homelab-media/jellyfin/cache:/cache
      - /mnt/storage/tvshows:/media/tv:ro
      - /mnt/storage/movies:/media/movies:ro
      - /mnt/storage/music:/media/music:ro

  # navidrome moved to services.navidrome in configuration.nix (native)

  immich-postgres:
    image: pgvector/pgvector:pg16
    container_name: immich-postgres
    # Postgres data must be local; the media NFS export is root-squashed.
    user: "1000:100"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set}
      POSTGRES_DB: immich
    volumes:
      - /var/lib/homelab-media/immich-postgres:/var/lib/postgresql/data

  immich-redis:
    image: redis:7
    container_name: immich-redis
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - /mnt/storage/appdata/media/immich-ml:/cache
    environment:
      - TZ=America/New_York

  arm:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: arm
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/sr0:/dev/sr0
    ports: ["8080:8080"]
    volumes:
      - /mnt/storage/appdata/media/arm:/home/arm
      - /mnt/storage/appdata/media/arm/logs:/home/arm/logs
      - /mnt/storage/appdata/media/arm/config:/etc/arm/config
      - /mnt/storage/movies:/home/arm/media/movies:rw
      - /mnt/storage/music:/home/arm/media/music:rw
      - /mnt/storage/tvshows:/home/arm/media/tvshows:rw
    environment:
      - ARM_UID=1000
      - ARM_GID=100

  # homepage moved to services.homepage-dashboard in configuration.nix (Nix-native, still :3000)

  rdt-client:
    image: rogerfar/rdtclient:latest
    container_name: rdt-client
    ports: ["6500:6500"]
    volumes:
      # Upstream docs: /data/db for sqlite + /data/downloads for downloads. We keep /downloads for
      # Lidarr compat (Lidarr/radarr/sonarr all use /mnt/storage/downloads:/downloads). If you use
      # /data/downloads here, set rdt-client Settings Download path=/data/downloads and add Lidarr
      # Remote Path Mapping Remote=/data/downloads Local=/downloads (or Local=/data/downloads if you
      # also change Lidarr mount). Host path is same for all arrs so /downloads/lidarr is visible
      # in both containers once systemd.tmpfiles creates it.
      - /mnt/storage/appdata/media/rdt-client:/data
      - /mnt/storage/downloads:/downloads
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

  # bazarr moved to services.bazarr in configuration.nix (native)

  # tautulli moved to services.tautulli in configuration.nix (native)

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    ports: ["6246:6246"]
    user: "1000:1000"
    volumes:
      - /mnt/storage/appdata/media/maintainerr:/opt/data
    environment:
      - TZ=America/New_York
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    volumes:
      - /mnt/storage/appdata/media/recyclarr:/config
    environment:
      - TZ=America/New_York
      - CRON_SCHEDULE=@daily
    restart: unless-stopped

  immich:
    <<: *common
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    # Upload state is NFS-backed and owned by elias; avoid root_squash writes.
    user: "1000:100"
    ports: ["2283:2283"]
    # serves photos at /mnt/storage/photos → https://photos.adal-matrix.ts.net via svc:photos
    depends_on:
      - immich-postgres
      - immich-redis
    devices:
      - /dev/dri:/dev/dri  # Vega 11 VAAPI for video transcode
    volumes:
      - /mnt/storage/immich:/usr/src/app/upload
      - /mnt/storage/photos:/usr/src/app/external:ro
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
